services:
  postgres:
    image: postgres:16-alpine
    container_name: mailorbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailorbit
      POSTGRES_PASSWORD: mailorbit_dev_password
      POSTGRES_DB: mailorbit
    ports:
      - "5432:5432"
    volumes:
      - mailorbit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailorbit -d mailorbit"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailorbit-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATA_FILE: "" # In-memory storage for local dev

volumes:
  mailorbit_pgdata:
    driver: local
