name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-boot-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Run linter (undefined names and syntax checks)
        run: |
          ruff check --select F821 .

      - name: Generate dynamic test credentials for CI
        run: |
          echo "ENCRYPTION_MASTER_KEY=$(python3 -c 'import secrets, base64; print(base64.b64encode(secrets.token_bytes(32)).decode())')" >> $GITHUB_ENV
          echo "TICK_SECRET=$(python3 -c 'import secrets; print(secrets.token_hex(20))')" >> $GITHUB_ENV
          echo "ADMIN_BOOTSTRAP_TOKEN=$(python3 -c 'import secrets; print(secrets.token_hex(20))')" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite:///./ci_test.db" >> $GITHUB_ENV
          echo 'ADMIN_EMAILS=["admin@example.com"]' >> $GITHUB_ENV

      - name: Run test suite
        env:
          ENVIRONMENT: "development"
        run: |
          pytest -v

      - name: Production Boot Verification
        env:
          ENVIRONMENT: "production"
          USE_FAKE_SMTP: "false"
        run: |
          python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 &
          PID=$!
          sleep 5

          echo "Checking GET /api/v1/health..."
          curl -f -s http://127.0.0.1:8000/api/v1/health | grep '"status":"ok"'

          echo "Checking HEAD /api/v1/health..."
          curl -f -I -s http://127.0.0.1:8000/api/v1/health

          echo "Checking GET /health..."
          curl -f -s http://127.0.0.1:8000/health | grep '"status":"ok"'

          echo "Checking HEAD /health..."
          curl -f -I -s http://127.0.0.1:8000/health

          echo "Checking HEAD /api/v1/tick with X-Tick-Secret..."
          curl -f -I -s -H "X-Tick-Secret: $TICK_SECRET" http://127.0.0.1:8000/api/v1/tick

          echo "Killing production server test process..."
          kill $PID
